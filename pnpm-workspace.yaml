# pnpm settings (pnpm 11 reads config from here, not the "pnpm" field in package.json)
# Native deps allowed to run their build/postinstall step:
#   sharp         — next/image optimization
#   unrs-resolver — eslint-config-next import resolver
allowBuilds:
  # Both arrived with next-intl and are only used by its optional SWC-based
  # message extractor. We keep translations in plain JSON catalogs under
  # messages/, so nothing on our runtime path needs their native build.
  '@parcel/watcher': false
  '@swc/core': false
  sharp: true
  unrs-resolver: true
